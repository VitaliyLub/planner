xst=(o.reply||'План составлен.')+' Создано задач: '+out.length+(drop?', отброшено: '+drop:'')+'.'}catch(e){xst='Ошибка: '+(e.name=='AbortError'?'сервер не ответил':e.message)+'. Можно составить план по простым правилам кнопкой «Без ИИ».'}
save();render()}

function TL(it,d){const K=.85,MH=36,vis=it.filter(x=>x.s<=1440).sort((p,q)=>p.s-q.s||p.e-q.e),un=it.filter(x=>x.s>1440);let a=360,b=1380;
vis.forEach(x=>{if(x.s<a)a=Math.floor(x.s/60)*60;const e=Math.max(x.e,x.s+30);if(e>b)b=Math.ceil(e/60)*60});
const ends=[];vis.forEach(x=>{const ve=Math.max(x.e,x.s+MH/K);let l=ends.findIndex(v=>v<=x.s);if(l<0)l=ends.length;ends[l]=ve;x.l=l});const nl=Math.max(1,ends.length);
let g='';for(let t=a;t<=b;t+=60)g+='<div class="hl" style="top:'+(t-a)*K+'px"><span>'+pad(Math.floor(t/60)%24)+'</span></div>';
const bl=vis.map(x=>{const hh=Math.max((x.e-x.s)*K,MH),w=100/nl,sm=hh<52,lc=Math.max(1,Math.floor((hh-24)/18));return'<div class="blk '+(x.k=='c'?'bc':'bt')+(x.dn?' dn':'')+'" '+(x.id?'data-id="'+x.id+'" ':'data-k="'+(x.key||'')+'" ')+'data-a="pv" style="top:'+(x.s-a)*K+'px;height:'+hh+'px;left:calc('+x.l*w+'% + 2px);width:calc('+w+'% - 4px)">'+(x.id?'<input type="checkbox" data-a="done" data-id="'+x.id+'" '+(x.dn?'checked':'')+' aria-label="Готово">':'')+'<div class="bt2"><div class="tt" style="-webkit-line-clamp:'+(sm?1:lc)+'">'+(sm?'<span class="mu">'+hm(x.s)+'</span> ':'')+esc(x.n)+'</div>'+(sm?'':'<div class="mu">'+hm(x.s)+'–'+hm(x.e)+'</div>')+'</div></div>'}).join('');
const n=new Date(),nm=n.getHours()*60+n.getMinutes(),nw=d==ymd(n)&&nm>=a&&nm<=b?'<div class="nowl" style="top:'+(nm-a)*K+'px"></div>':'';
const uh=un.length?'<div class="mu" style="margin:16px 0 4px">Без времени</div>'+un.map(x=>'<div class="blk bt fl2'+(x.dn?' dn':'')+'" data-id="'+x.id+'" data-a="pv"><input type="checkbox" data-a="done" data-id="'+x.id+'" '+(x.dn?'checked':'')+' aria-label="Готово"><div class="bt2"><div class="tt" style="-webkit-line-clamp:2">'+esc(x.n)+'</div><div class="mu">'+esc(x.m)+'</div></div></div>').join(''):'';
return'<div class="tl" style="height:'+(b-a)*K+'px">'+g+'<div class="lane">'+bl+nw+'</div></div>'+uh}
function showPv(id,key){const t=id&&S.tasks.find(q=>q.id==id);let body='',act='';
if(t){const d=ymd(cur),ch=(plan().res[d]||[]).find(x=>x.id==t.id)||fixed(d).find(x=>x.id==t.id);body='<h2 class="pvt">'+esc(t.title)+'</h2><div class="mu">'+t.cat+', '+dur(t.min)+(t.st?', начало '+t.st:ch?', '+hm(ch.s)+'–'+hm(ch.e):'')+(t.due?(t.dl?', до ':', на ')+t.due:'')+(t.al?', будильник'+(t.alm?' за '+t.alm+' мин':''):'')+(t.done?', выполнено':'')+'</div>'+DET(t);act='<button class="p" data-a="ed" data-id="'+t.id+'">Редактировать</button>'}
else{const c=classesAll(ymd(cur)).find(x=>x.key==key);if(!c)return;body='<h2 class="pvt">'+esc(c.n)+'</h2><div class="mu">'+hm(c.s)+'–'+hm(c.e)+', '+esc(c.m)+'</div>'}
const o=document.createElement('div');o.id='pv';o.className='pvb';o.innerHTML='<div class="pvc">'+body+'<div class="bar" style="margin-top:16px">'+act+'<button data-a="pc">Закрыть</button></div></div>';document.body.appendChild(o)}
function showMenu(k,x,y){document.getElementById('cm')?.remove();const m=document.createElement('div');m.id='cm';m.style.cssText='left:'+Math.max(8,Math.min(x,innerWidth-200))+'px;top:'+Math.max(8,Math.min(y,innerHeight-90))+'px';m.innerHTML='<button data-a="ed" data-id="'+k.dataset.id+'">Редактировать задачу</button>';document.body.appendChild(m);navigator.vibrate&&navigator.vibrate(15)}
let lpT=0,lpF=0;document.addEventListener('pointerdown',e=>{lpF=0;const k=e.target.closest('.blk[data-id]');if(!k||e.target.closest('input'))return;lpT=setTimeout(()=>{lpF=1;showMenu(k,e.clientX,e.clientY)},520)});
['pointerup','pointercancel','pointermove'].forEach(t=>document.addEventListener(t,e=>{if(t=='pointermove'&&Math.hypot(e.movementX||0,e.movementY||0)<3)return;clearTimeout(lpT)}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.blk[data-id]'))e.preventDefault()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
