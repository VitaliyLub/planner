function notify(t,b){try{if(window.Notification&&Notification.permission==='granted'){if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',vibrate:[200,100,200]}));else new Notification(t,{body:b})}}catch(e){}}
function vDay(){const d=ymd(cur),P=plan(),it=[...(em?classesAll(d):classes(d)),...fixed(d),...(P.res[d]||[])].sort((a,b)=>a.s-b.s);let h='',p=420;
for(const x of it){if(x.s-p>=20)h+=`<div class="gap">свободно ${dur(x.s-p)}</div>`;h+=em&&x.key?`<div class="row c ed${x.x?' off':''}"><input data-ov="${x.key}" data-f="n" value="${esc(x.n)}" aria-label="Предмет"><div class="bar"><input type="time" data-ov="${x.key}" data-f="s" value="${hm(x.s)}" aria-label="Начало"><input type="time" data-ov="${x.key}" data-f="e" value="${hm(x.e)}" aria-label="Конец"><button data-a="cx" data-k="${x.key}">${x.x?'Вернуть':x.ex?'Удалить':'Отменить'}</button>${x.ch&&!x.ex?`<button data-a="rs" data-k="${x.key}">Сбросить</button>`:''}</div></div>`:`<div class="row ${x.k}"><div class="tm">${hm(x.s)}–${hm(x.e)}</div><div><div>${esc(x.n)}</div><div class="mu">${x.k=='c'?'пара, ':''}${esc(x.m)}${x.ch?', изменено':''}</div>${x.id?DETid(x.id):''}</div></div>`;p=Math.max(p,x.e)}
if(1380-p>=20&&it.length)h+=`<div class="gap">свободно ${dur(1380-p)} до отбоя</div>`;
if(!it.length&&!S.tasks.some(t=>!t.done&&(!t.due||t.due<=d)))h='<p class="mu">На этот день ничего нет. Добавь задачу на вкладке «Задачи», и я найду для неё время.</p>';
const tdy=ymd(new Date()),cl=classes(d),pm=cl.reduce((a,x)=>a+x.e-x.s,0),fx=fixed(d),ls=S.tasks.filter(t=>!t.done&&!t.st&&(t.due==d||(d==tdy&&(!t.due||t.due<d))));const tmn=ls.reduce((a,t)=>a+t.min,0)+fx.reduce((a,x)=>a+x.e-x.s,0);const sum='Пары: '+cl.length+' ('+dur(pm)+'), задачи: '+(ls.length+fx.length)+' ('+dur(tmn)+')';
const ul=ls.length?'<h1 style="margin-top:28px;font-size:18px">Дела без точного времени</h1>'+ls.map(t=>{const c=(P.res[d]||[]).find(x=>x.id==t.id);return`<div class="tk"><input type="checkbox" data-a="done" data-id="${t.id}" aria-label="Готово"><div class="g"><span class="n" data-a="ed" data-id="${t.id}" style="cursor:pointer">${esc(t.title)}</span><div class="mu">${t.cat}, ${dur(t.min)}${t.due&&t.due<d?', просрочено':''}${c?', в плане на '+hm(c.s):''}</div>${DET(t)}</div></div>`}).join(''):'';
return`<h1>${cur.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</h1><div class="bar"><button data-a="prev" aria-label="Предыдущий день">‹</button><button data-a="today">Сегодня</button><button data-a="next" aria-label="Следующий день">›</button><span class="g"></span><button data-a="em" class="${em?'p':''}">${em?'Готово':'Править пары'}</button></div><div class="mu" style="margin:-8px 0 12px">${sum}</div>${em?'<p class="mu">Изменения касаются только этого дня.</p><button data-a="ae" style="margin-bottom:12px">+ Добавить внеплановую пару</button>':''}${h}${ul}`}
function vTasks(){const P=plan(),et=S.tasks.find(x=>x.id==eid)||{};let l=S.tasks.slice().sort((a,b)=>a.done-b.done||(a.due||'9999').localeCompare(b.due||'9999')).map(t=>`<div class="tk ${t.done?'d':''}"><input type="checkbox" data-a="done" data-id="${t.id}" ${t.done?'checked':''} aria-label="Готово"><div class="g"><span class="n" data-a="ed" data-id="${t.id}" style="cursor:pointer">${esc(t.title)}</span><div class="mu">${t.cat}, ${dur(t.min)}${t.st?', в '+t.st:''}${t.al?', будильник'+(t.alm?' за '+t.alm+' мин':''):''}${t.due?', до '+t.due.split('-').reverse().slice(0,2).join('.'):''}${!t.done&&P.over[t.id]>0?', <b style="color:#ffb86b">не хватает времени: '+dur(P.over[t.id])+'</b>':''}</div>${DET(t)}</div><button data-a="del" data-id="${t.id}" aria-label="Удалить">×</button></div>`).join('');
return`<h1>Задачи</h1><form id="f"><input class="w" name="t" placeholder="Что нужно сделать" value="${esc(et.title||'')}" required><select name="c"><option>быт</option><option ${et.cat=='учёба'?'selected':''}>учёба</option></select><select name="p">${[['2','важно'],['1','обычно'],['0','не срочно']].map(o=>`<option value="${o[0]}" ${(et.pr??1)==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><label class="fl mu">Минут на задачу<input type="number" name="m" min="5" step="5" value="${et.min||45}"></label><label class="fl mu">Срок<input type="date" name="d" value="${et.due||''}"></label><label class="fl mu">Начало в (необязательно)<input type="time" name="st" value="${et.st||''}"></label><textarea class="w" name="ds" rows="2" placeholder="Описание (необязательно)">${esc(et.desc||'')}</textarea><textarea class="w" name="li" rows="3" placeholder="Список, по пункту на строке (например, что купить)">${esc((et.items||[]).map(q=>q.t).join('\n'))}</textarea><label class="mu"><input type="checkbox" name="al" ${et.al?'checked':''}> Будильник</label><select name="alm" aria-label="За сколько звонить">${[[0,'в начале'],[5,'за 5 минут'],[10,'за 10 минут'],[15,'за 15 минут'],[30,'за 30 минут'],[60,'за час']].map(o=>`<option value="${o[0]}" ${(et.alm||0)==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="p w">${eid?'Сохранить':'Добавить в план'}</button>${eid?'<button type="button" class="w" data-a="ec">Отмена</button>':''}</form>${l||'<p class="mu">Пока пусто.</p>'}`}
function vFocus(){return`<h1>Фокус</h1><p class="mu">Положи телефон экраном вниз и работай до сигнала.</p><div class="big" id="tm">${ft?'':pad(S.fm||30)+':00'}</div><div class="bar" style="justify-content:center"><input type="number" id="fm" min="1" max="240" value="${S.fm||30}" style="width:84px" aria-label="Минут фокуса"><span class="mu">мин</span><button class="p" data-a="f">Старт</button><button data-a="fs">Стоп</button></div>`}
function vStat(){const b=[];let tot=0;for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const m=S.focus[ymd(d)]||0;tot+=m;b.push([d.toLocaleDateString('ru-RU',{weekday:'short'}),m])}
const mx=Math.max(60,...b.map(x=>x[1])),done=S.tasks.filter(t=>t.done&&t.at>Date.now()-6048e5).length,np=window.Notification?Notification.permission:'нет';
return`<h1>Итоги</h1><p>За 7 дней: фокус ${dur(tot)}, задач выполнено ${done}.</p><div class="chart">${b.map(x=>`<div><i style="height:${x[1]/mx*90}px"></i>${x[0]}</div>`).join('')}</div><h1 style="margin-top:32px">Напоминания</h1><div class="bar"><select id="ld"><option value="10">за 10 минут</option><option value="30">за 30 минут</option><option value="60">за час</option></select><button data-a="nt">${np==='granted'?'Включены':'Включить'}</button></div><p class="mu">Приложение напомнит о парах и задачах из плана, пока оно открыто.</p>`}
function render(){const m=document.getElementById('m');m.innerHTML={day:vDay,tasks:vTasks,focus:vFocus,stat:vStat}[tab]();
document.getElementById('nv').innerHTML=[['day','День'],['tasks','Задачи'],['focus','Фокус'],['stat','Итоги']].map(x=>`<button data-a="tab" data-t="${x[0]}" class="${tab==x[0]?'on':''}">${x[1]}</button>`).join('');
const ld=document.getElementById('ld');if(ld){ld.value=S.lead;ld.onchange=()=>{S.lead=+ld.value;save()}}
const f=document.getElementById('f');if(f)f.onsubmit=e=>{e.preventDefault();const v=new FormData(f);const ot=S.tasks.find(x=>x.id==eid);const nt={title:v.get('t'),cat:v.get('c'),pr:+v.get('p'),min:+v.get('m')||30,due:v.get('d')||(v.get('st')?ymd(new Date()):''),st:v.get('st')||'',desc:v.get('ds').trim(),al:v.get('al')=='on',alm:+v.get('alm')||0,items:v.get('li').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const o=((ot&&ot.items)||[]).find(q=>q.t==s);return{t:s,d:o?o.d:false}})};if(ot){Object.assign(ot,nt);eid=null}else S.tasks.push(Object.assign({id:Date.now()},nt));save();render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a=='tab'){tab=b.dataset.t;render()}else if(a=='prev'||a=='next'){cur.setDate(cur.getDate()+(a=='next'?1:-1));render()}
else if(a=='today'){cur=new Date();cur.setHours(0,0,0,0);render()}
else if(a=='done'){const t=S.tasks.find(x=>x.id==b.dataset.id);t.done=b.checked;t.at=Date.now();save();render()}
else if(a=='del'){S.tasks=S.tasks.filter(x=>x.id!=b.dataset.id);save();render()}
else if(a=='f'){const m=Math.max(1,Math.min(240,+document.getElementById('fm').value||30));S.fm=m;save();ft={end:Date.now()+m*6e4,min:m}}else if(a=='fs'){ft=null;const t=document.getElementById('tm');if(t)t.textContent=pad(S.fm||30)+':00'}
else if(a=='nt'){try{Notification.requestPermission().then(render)}catch(x){}}
else if(a=='em'){em=!em;render()}
else if(a=='cx'){const k=b.dataset.k;if(k[0]=='x')S.extra=S.extra.filter(q=>'x'+q.id!=k);else{S.ov[k]=S.ov[k]||{};S.ov[k].x=!S.ov[k].x}save();render()}
else if(a=='rs'){delete S.ov[b.dataset.k];save();render()}
else if(a=='ae'){S.extra.push({id:Date.now(),d:ymd(cur),s:'08:30',e:'10:05',n:'Новая пара'});save();render()}
else if(a=='ed'){eid=+b.dataset.id;tab='tasks';render();scrollTo(0,0)}
else if(a=='ec'){eid=null;render()}
else if(a=='li'){const t=S.tasks.find(q=>q.id==b.dataset.id);t.items[+b.dataset.i].d=b.checked;save();render()}});
document.addEventListener('change',e=>{const i=e.target.closest('[data-ov]');if(!i)return;const k=i.dataset.ov,f=i.dataset.f,v=i.value;if(k[0]=='x'){const x=S.extra.find(q=>'x'+q.id==k);if(x&&v)x[f]=v}else{S.ov[k]=S.ov[k]||{};if(v)S.ov[k][f]=v}save();render()});
setInterval(()=>{const t=document.getElementById('tm');if(ft){const r=Math.max(0,ft.end-Date.now());if(t)t.textContent=pad(Math.floor(r/6e4))+':'+pad(Math.floor(r/1e3)%60);
if(r<=0){const k=ymd(new Date());S.focus[k]=(S.focus[k]||0)+ft.min;save();ft=null;notify('Фокус завершён','Сделай перерыв, телефон не трогай.');if(t)t.textContent=pad(S.fm||30)+':00'}}
const n=new Date(),k=ymd(n),now=n.getHours()*60+n.getMinutes();
for(const x of[...classes(k),...fixed(k),...(plan().res[k]||[])]){const id=k+x.s+x.n;if(!sent.has(id)&&now>=x.s-S.lead&&now<x.s){sent.add(id);notify(x.n,'Начало в '+hm(x.s))}const tk=x.id&&S.tasks.find(q=>q.id==x.id);if(tk&&tk.al&&!sent.has('a'+id)){const at=x.s-(tk.alm||0);if(now>=at&&now<at+3){sent.add('a'+id);ring(x.n)}}}},1000);
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
